<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>金融业务创新中心 2026上半年工作汇报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#e8ecf3; --bg2:#dde3ed; --card:#ffffff;
  --line:rgba(100,130,180,.16); --line-strong:rgba(100,130,180,.3);
  --gold:#b8862f; --gold-dim:#a3761f; --blue:#2f6fbd; --blue-bright:#1d5fab;
  --emerald:#0d9268; --red:#dc2626; --amber:#d97706; --purple:#7c3aed;
  --text:#1e293b; --text-dim:#64748b; --text-bright:#0f172a;
  --f-zh:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--f-zh);-webkit-font-smoothing:antialiased}
body{background:var(--bg)}

/* ===== NAV ===== */
#deck{position:fixed;inset:0;z-index:10}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:64px 72px 56px;overflow:auto;background:var(--bg)}
.slide.active{display:flex;animation:slideIn .35s ease-out}
@keyframes slideIn{from{transform:translateY(12px)}to{transform:translateY(0)}}

/* ===== COVER ===== */
.cover{justify-content:center;align-items:center;text-align:center;gap:16px;background:linear-gradient(135deg,#dce4f0 0%,#e8ecf3 50%,#e2e7f0 100%)}
.cover-tag{font-size:20px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;
  border:1px solid var(--gold-dim);padding:6px 20px;border-radius:20px;display:inline-block}
.cover-title{font-size:clamp(46px,4.2vw,74px);font-weight:900;color:var(--text-bright);
  line-height:1.3;max-width:900px}
.cover-title .hl{background:linear-gradient(90deg,var(--gold),#e8c878);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.cover-sub{font-size:clamp(23px,1.6vw,31px);color:var(--text-dim);font-weight:300}
.cover-meta{display:flex;gap:32px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.cover-meta span{font-size:22px;color:var(--text-dim)}
.cover-meta b{color:var(--gold);font-weight:700}
.cover-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto}

/* ===== CHAPTER DIVIDER ===== */
.chapter{justify-content:center;align-items:center;padding:0 100px;flex-direction:row;gap:80px}
.chapter-num{font-size:clamp(115px,12vw,230px);font-weight:900;color:rgba(184,134,47,.1);
  line-height:1;font-family:Georgia,serif}
.chapter-title{font-size:clamp(41px,3.6vw,64px);font-weight:900;color:var(--text-bright);
  margin-top:-30px;position:relative;z-index:1}
.chapter-title .hl{color:var(--gold)}
.chapter-left{display:flex;flex-direction:column;align-items:flex-start}
.chapter-desc{font-size:26px;color:var(--text-dim);line-height:2;
  border-left:2px solid var(--gold);padding-left:20px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.chapter-desc span{display:block}
.chapter-bar{width:60px;height:4px;background:var(--gold);border-radius:2px;margin:20px 0}

/* ===== COMMON ===== */
.page-head{margin-bottom:20px;flex-shrink:0}
.page-head h2{font-size:clamp(31px,2.4vw,43px);font-weight:800;color:var(--text-bright)}
.page-head .sub{font-size:20px;color:var(--text-dim);margin-top:4px}
.page-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:auto}
.sec-title{font-size:23px;font-weight:700;color:var(--gold);margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}
.sec-card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sec-card-title{font-size:20px;font-weight:700;color:var(--blue-bright);margin-bottom:10px;
  letter-spacing:.5px}

/* ===== TABLES ===== */
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl th{background:rgba(47,111,189,.08);color:var(--blue-bright);font-weight:700;
  padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-strong);
  position:sticky;top:0;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);
  color:var(--text);vertical-align:top;line-height:1.5}
.tbl tr:hover td{background:rgba(47,111,189,.05)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:16px;font-weight:600}
.tag-gold{background:rgba(212,168,87,.15);color:var(--gold)}
.tag-blue{background:rgba(74,144,217,.15);color:var(--blue-bright)}
.tag-green{background:rgba(16,185,129,.15);color:var(--emerald)}
.tag-red{background:rgba(239,68,68,.15);color:var(--red)}
.tag-purple{background:rgba(139,92,246,.15);color:var(--purple)}

/* ===== SWOT ===== */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swot-q{border-radius:10px;padding:16px;min-height:120px}
.swot-s{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}
.swot-w{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.swot-o{background:rgba(74,144,217,.1);border:1px solid rgba(74,144,217,.3)}
.swot-t{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
.swot-q h4{font-size:19px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.swot-s h4{color:var(--emerald)} .swot-w h4{color:var(--red)}
.swot-o h4{color:var(--blue-bright)} .swot-t h4{color:var(--amber)}
.swot-q ul{list-style:none;padding:0}
.swot-q li{font-size:17px;color:var(--text);padding:3px 0;line-height:1.5;padding-left:12px;
  position:relative}
.swot-q li::before{content:"·";position:absolute;left:2px;color:var(--text-dim)}

/* ===== LISTS ===== */
ul.clean{list-style:none;padding:0}
ul.clean li{font-size:19px;color:var(--text);padding:4px 0;padding-left:16px;position:relative;line-height:1.6}
ul.clean li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:16px}

/* ===== STRATEGY BOX ===== */
.strat-box{display:flex;gap:16px;flex-wrap:wrap}
.strat-col{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px}
.strat-col h5{font-size:19px;font-weight:700;color:var(--gold);margin-bottom:8px}

/* ===== STAT CARDS ===== */
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:16px;text-align:center}
.stat .num{font-size:41px;font-weight:900;color:var(--gold)}
.stat .lbl{font-size:17px;color:var(--text-dim);margin-top:4px}

/* ===== GRID ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ===== COMPARISON ===== */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.compare-col{border-radius:10px;padding:18px}
.compare-keep{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25)}
.compare-change{background:rgba(212,168,87,.08);border:1px solid rgba(212,168,87,.25)}
.compare-col h4{font-size:22px;font-weight:800;margin-bottom:12px}
.compare-keep h4{color:var(--emerald)} .compare-change h4{color:var(--gold)}
.compare-col li{font-size:20px;padding:6px 0;list-style:none;padding-left:18px;position:relative;line-height:1.6}
.compare-keep li::before{content:"●";position:absolute;left:0;color:var(--emerald);font-size:14px}
.compare-change li::before{content:"→";position:absolute;left:0;color:var(--gold)}

/* ===== HUD ===== */
.hud{position:fixed;bottom:0;left:0;right:0;z-index:50;height:40px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;background:linear-gradient(0deg,rgba(244,246,250,.95),transparent);
  border-top:1px solid var(--line)}
.hud-counter{font-size:19px;color:var(--text-dim);font-family:Georgia,serif}
.hud-counter b{color:var(--gold)}
.hud-nav{display:flex;gap:12px}
.hud-nav button{background:none;border:1px solid var(--line-strong);color:var(--text-dim);
  width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:20px;transition:.2s}
.hud-nav button:hover{border-color:var(--gold);color:var(--gold)}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:60;
  transition:width .4s ease}

/* ===== CHART WRAP ===== */
.chart-wrap{position:relative;width:100%}

/* ===== TOP NAV ===== */
.topnav{position:fixed;top:0;left:0;right:0;z-index:55;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topnav-left{display:flex;align-items:center;gap:14px}
.topnav-logo{font-size:22px;font-weight:800;color:var(--blue-bright);letter-spacing:.5px}
.topnav-logo .ac{color:var(--gold)}
.nav-idx{display:flex;align-items:center;gap:6px;cursor:pointer;
  padding:5px 14px;border:1px solid var(--line-strong);border-radius:18px;
  font-size:19px;color:var(--text-dim);transition:.2s;user-select:none}
.nav-idx:hover{border-color:var(--blue-bright);color:var(--blue-bright)}
.nav-idx b{color:var(--blue-bright);font-family:Georgia,serif;font-weight:700}
.nav-idx .arrow{font-size:13px;transition:.2s;margin-left:2px}
.nav-idx.open .arrow{transform:rotate(180deg)}
.nav-title{font-size:19px;color:var(--text-dim);font-weight:600;max-width:400px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nav-menu{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:56;
  display:none;flex-direction:column;width:min(520px,90vw);max-height:70vh;overflow-y:auto;
  padding:10px;border-radius:0 0 12px 12px;
  background:rgba(255,255,255,.98);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-top:none;
  box-shadow:0 12px 40px rgba(0,0,0,.1)}
.nav-menu.open{display:flex;animation:navIn .2s ease-out}
@keyframes navIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.nav-group{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:1px;
  padding:8px 14px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;
  cursor:pointer;transition:.15s;border:1px solid transparent}
.nav-item:hover{background:rgba(47,111,189,.06);border-color:var(--line)}
.nav-item.active{background:rgba(47,111,189,.1);border-color:var(--blue-bright)}
.nav-item-num{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--blue-bright);
  min-width:24px}
.nav-item-label{font-size:19px;color:var(--text);font-weight:500}
.nav-item.active .nav-item-label{color:var(--blue-bright);font-weight:700}
.nav-chapter{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-top:6px;
  border-radius:8px;cursor:pointer;transition:.15s;
  background:linear-gradient(90deg,rgba(47,111,189,.06),transparent);
  border:1px solid var(--line)}
.nav-chapter:hover{background:rgba(47,111,189,.1);border-color:var(--blue-bright)}
.nav-chapter.active{background:rgba(47,111,189,.12);border-color:var(--blue-bright)}
.nav-chapter-g{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:1px;
  padding:2px 8px;border-radius:4px;background:rgba(184,134,47,.1)}
.nav-chapter-t{font-size:20px;font-weight:700;color:var(--text-bright)}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="topnav">
  <div class="topnav-left">
    <div class="topnav-logo">金融业务创新中心 · <span class="ac">半年总结</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="nav-title" id="navTitle">封面</div>
    <div class="nav-idx" id="navIdx" onclick="toggleNavMenu(event)">
      <b id="navCur">01</b> / <span id="navTotal">21</span>
      <span class="arrow">▼</span>
    </div>
  </div>
</div>
<div class="nav-menu" id="navMenu"></div>
<div id="deck"></div>
<div class="hud">
  <div class="hud-counter"><b id="curNum">01</b> / <span id="totalNum">21</span></div>
  <div class="hud-nav">
    <button onclick="go(-1)">‹</button>
    <button onclick="go(1)">›</button>
  </div>
</div>
<script>
const PAGE_TITLES = [
  {t:"封面",g:""},
  {t:"上半年工作汇报",g:"第一章",ch:true},
  {t:"数据安全工作",g:"第一章"},
  {t:"AI项目工作",g:"第一章"},
  {t:"产品相关工作",g:"第一章"},
  {t:"新客户/伙伴/方案开拓工作",g:"第一章"},
  {t:"待跟进项目",g:"第一章"},
  {t:"内部提效成果",g:"第一章"},
  {t:"上半年工作回顾",g:"第一章"},
  {t:"下半年工作规划",g:"第二章",ch:true},
  {t:"业绩目标拆解",g:"第二章"},
  {t:"下半年部门目标及战役规划",g:"第二章"},
  {t:"战役一：金融AI专项小组组建与运营",g:"第二章"},
  {t:"战役二：AI标杆项目落地",g:"第二章"},
  {t:"战役三：金租行业Skill沉淀与开箱即用场景",g:"第二章"},
  {t:"战役四：数据安全业务破局",g:"第二章"},
  {t:"战役五：统一监管报送平台产品完善与金租一表通启动",g:"第二章"},
  {t:"战役六：内部提效Skill化与全员赋能",g:"第二章"},
  {t:"资源保障及领导支持",g:"第二章"},
  {t:"总结",g:"第三章",ch:true},
  {t:"三个不变与三个改变",g:"第三章"},
];

function buildNavMenu(){
  const menu = document.getElementById('navMenu');
  let html = '';
  let lastGroup = '';
  PAGE_TITLES.forEach((p,i)=>{
    if(p.g && p.g !== lastGroup){
      if(p.ch){
        // 章节分隔页本身作为可点击的章节标题
        html += `<div class="nav-chapter" data-i="${i}" onclick="jumpTo(${i})">
          <span class="nav-chapter-g">${p.g}</span>
          <span class="nav-chapter-t">${p.t}</span>
        </div>`;
      } else {
        html += `<div class="nav-group">${p.g}</div>`;
      }
      lastGroup = p.g;
    } else if(p.ch){
      html += `<div class="nav-chapter" data-i="${i}" onclick="jumpTo(${i})">
        <span class="nav-chapter-g">${p.g}</span>
        <span class="nav-chapter-t">${p.t}</span>
      </div>`;
    }
    if(!p.ch){
      html += `<div class="nav-item" data-i="${i}" onclick="jumpTo(${i})">
        <span class="nav-item-num">${String(i+1).padStart(2,'0')}</span>
        <span class="nav-item-label">${p.t}</span>
      </div>`;
    }
  });
  menu.innerHTML = html;
}

function toggleNavMenu(e){
  e?.stopPropagation();
  const menu = document.getElementById('navMenu');
  const idx = document.getElementById('navIdx');
  const open = menu.classList.toggle('open');
  idx.classList.toggle('open', open);
  if(open) updateNavActive();
}

function jumpTo(i){
  cur = i;
  render();
  document.getElementById('navMenu').classList.remove('open');
  document.getElementById('navIdx').classList.remove('open');
}

function updateNavActive(){
  document.querySelectorAll('.nav-item,.nav-chapter').forEach(it=>{
    it.classList.toggle('active', parseInt(it.dataset.i)===cur);
  });
}

document.addEventListener('click',e=>{
  const menu = document.getElementById('navMenu');
  const idx = document.getElementById('navIdx');
  if(menu.classList.contains('open') && !menu.contains(e.target) && !idx.contains(e.target)){
    menu.classList.remove('open'); idx.classList.remove('open');
  }
});

const SLIDES = [

/* ===== 0. COVER ===== */
`<div class="slide cover active">
  <div class="cover-tag">2026 SEMI-ANNUAL REPORT</div>
  <div class="cover-line"></div>
  <h1 class="cover-title">金融业务创新中心<br><span class="hl">2026年上半年工作汇报</span></h1>
  <p class="cover-sub">数据安全 · AI项目 · 产品建设 · 客户开拓 · 内部提效</p>
  <div class="cover-meta">
    <span>汇报人：<b>吴思全</b></span>
    <span>部门：<b>金融事业部·金融业务创新中心</b></span>
    <span>日期：<b>2026年7月</b></span>
  </div>
</div>`,

/* ===== 1. CHAPTER 1 ===== */
`<div class="slide chapter">
  <div class="chapter-left">
    <div class="chapter-num">01</div>
    <div class="chapter-bar"></div>
    <h2 class="chapter-title">上半年<span class="hl">工作汇报</span></h2>
  </div>
  <div class="chapter-desc"><span>数据安全</span><span>AI项目</span><span>产品建设</span><span>客户伙伴开拓</span><span>待跟进项目</span><span>内部提效成果</span><span>工作回顾</span></div>
</div>`,

/* ===== 2. 数据安全工作 ===== */
`<div class="slide">
  <div class="page-head"><h2>数据安全工作</h2><div class="sub">整体情况 · SWOT分析与策略 · 重点跟进客户项目</div></div>
  <div class="page-body">
    <div class="sec-card">
      <div class="sec-card-title">整体情况</div>
      <ul class="clean">
        <li>目前掌握总的客户数：<b style="color:var(--gold)">52个</b>（合作1个（贵银金租），待定19，32个不合作）</li>
        <li>剩余待定客户中：已沟通8个，未沟通11个（广融达金租、苏银金租、珠江金租、华运金租、招银金租、青银金租、恒鑫金租、通达金租、中国金融租赁有限公司、中美联泰保险、中荷人寿）</li>
        <li>近期重点跟进中：珠江金租、瑞士银行、横琴华通金租</li>
      </ul>
    </div>
    <div class="sec-card">
      <div class="sec-card-title">SWOT分析</div>
      <div class="swot">
        <div class="swot-q swot-s"><h4>优势 Strengths</h4><ul><li>存量金融客户渠道成熟</li><li>数据治理底座天然融合</li></ul></div>
        <div class="swot-q swot-w"><h4>劣势 Weaknesses</h4><ul><li>无自研安全核心产品</li><li>安全资质与案例缺失</li><li>售前及交付团队安全能力不足</li><li>采购成本高、议价权弱</li></ul></div>
        <div class="swot-q swot-o"><h4>机会 Opportunities</h4><ul><li>93号文驱动合规刚需爆发</li><li>治理+安全融合成新趋势</li><li>中小金融/租赁/保险/消金等客户机会</li></ul></div>
        <div class="swot-q swot-t"><h4>威胁 Threats</h4><ul><li>头部安全厂商降维竞争</li><li>同质化价格战压缩利润</li><li>客户安全品牌认知固化</li><li>安全准入门槛持续抬升</li></ul></div>
      </div>
    </div>
    <div class="strat-box">
      <div class="strat-col"><h5>现有策略</h5><ul class="clean"><li>与昂楷国产安全厂商形成战略合作</li><li>基于现有金融租赁存量客户推广93号文合规升级方案</li><li>打包治理+安全一体化方案</li></ul></div>
      <div class="strat-col"><h5>建议策略</h5><ul class="clean"><li>是否能找其他安全厂商进行合作，补齐资质案例硬门槛</li></ul></div>
    </div>
    <div class="sec-card">

/* ===== RENDER ===== */
const deck = document.getElementById('deck');
let cur = 0;
const total = SLIDES.length;
document.getElementById('totalNum').textContent = String(total).padStart(2,'0');
document.getElementById('navTotal').textContent = String(total).padStart(2,'0');

let inited = false;
function buildDeck(){
  deck.innerHTML = SLIDES.map((s,i)=>{
    let cls = 'slide';
    if(s.includes('slide cover')) cls = 'slide cover';
    else if(s.includes('slide chapter')) cls = 'slide chapter';
    return s.replace(cls+'">', cls+(i===0?' active':'')+'">').replace(cls+'>', cls+(i===0?' active':'')+'>');
  }).join('');
}
function render(){
  if(!inited){ buildDeck(); inited = true; initCharts(); }
  const els = deck.querySelectorAll('.slide');
  els.forEach((el,i)=> el.classList.toggle('active', i===cur));
  document.getElementById('curNum').textContent = String(cur+1).padStart(2,'0');
  document.getElementById('progress').style.width = `${((cur+1)/total)*100}%`;
  document.getElementById('navCur').textContent = String(cur+1).padStart(2,'0');
  document.getElementById('navTitle').textContent = PAGE_TITLES[cur]?.t || '';
  updateNavActive();
}

function go(dir){
  cur = Math.max(0, Math.min(total-1, cur+dir));
  render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') {e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') {e.preventDefault();go(-1);}
});
